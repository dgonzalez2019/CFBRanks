name: Fetch NFL data
on:
  workflow_dispatch:
    inputs:
      history:
        description: "Past seasons to (re)write, e.g. 2015-2025 (blank = current season only)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  nfl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python scripts/fetch_nfl.py ${{ github.event.inputs.history && format('--history {0}', github.event.inputs.history) || '' }}
      - run: python scripts/track_picks.py --league nfl || echo "NFL tracker failed"
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/nfl
          git diff --cached --quiet || (git commit -m "Update NFL data" && git pull --rebase && git push)
