name: Update game results
on:
  schedule:
    - cron: "17 */3 * * 6,0"   # every 3 hours on Saturdays and Sundays (UTC)
    - cron: "17 12 * * 1-5"    # once each weekday morning
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy
      - run: python scripts/fetch_games.py --lines data/lines.json --players data/players.json
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      - name: Fetch injuries (optional)
        run: python scripts/fetch_injuries.py --out data/injuries.json || echo "Injury fetch failed; keeping the previous file."
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/games.json data/lines.json
          if [ -f data/players.json ]; then git add data/players.json; fi
          if [ -f data/injuries.json ]; then git add data/injuries.json; fi
          git diff --cached --quiet || (git commit -m "Update game results" && git push)
