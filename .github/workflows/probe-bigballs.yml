name: Probe BigBalls API
# One-off: read BigBalls' docs and find the working API address/auth for injuries. Safe to delete afterwards.
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python research/probe_bigballs.py
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
